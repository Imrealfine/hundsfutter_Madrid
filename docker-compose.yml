services:

  postgres:
    image: postgres:15-alpine
    container_name: medusa_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: medusa

    volumes:
      - medusa_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa -d medusa"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - medusa_network


  redis:
    image: redis:7-alpine
    container_name: medusa_redis
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - medusa_network


  medusa:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: medusa_backend
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    ports:
      - "9000:9000"
      - "5173:5173"

    environment:
      NODE_ENV: development

      DATABASE_URL: postgres://medusa:${POSTGRES_PASSWORD}@postgres:5432/medusa
      REDIS_URL: redis://redis:6379

      # 本地 Storefront
      STORE_CORS: http://localhost:8000,http://localhost:3000,http://192.168.68.58:8000

      # Medusa Admin
      ADMIN_CORS: https://hundsfutter.dongxu.info,http://192.168.68.58:9000,http://localhost:9000

      # 登录 / Session
      AUTH_CORS: https://hundsfutter.dongxu.info,http://192.168.68.58:9000,http://localhost:9000,http://localhost:8000,http://localhost:3000

      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}

      MEDUSA_BACKEND_URL: https://hundsfutter.dongxu.info
      MEDUSA_FILE_URL: https://hundsfutter.dongxu.info/static

    volumes:
      - medusa_uploads:/server/apps/backend/static

    networks:
      - medusa_network


volumes:
  medusa_postgres_data:
  medusa_uploads:


networks:
  medusa_network:
    driver: bridge
